# Render Blueprint — deploy the Tender RAG app as a FREE Docker web service.
# Secrets (DB password, API keys) are entered in the Render dashboard (sync: false);
# non-secret values are set here. See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: tender-rag
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # --- Neon Postgres (secrets: fill in the dashboard) ---
      - key: POSTGRES_HOST        # <your-project>.neon.tech
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_SSLMODE
        value: require
      # --- embeddings: in-process fastembed (no key, no quota) ---
      - key: EMBED_PROVIDER
        value: fastembed
      # --- chat: Groq (secret: fill in the dashboard) ---
      - key: GROQ_API_KEY         # console.groq.com
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # --- cloud is query-only (no local scrapers) ---
      - key: ENABLE_SCRAPING
        value: "false"
      - key: TOP_K
        value: "8"
