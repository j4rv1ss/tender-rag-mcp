# Render Blueprint — the Tender RAG MCP server over streamable HTTP.
# Endpoint: https://<service>.onrender.com/mcp   (bearer token required)
# Secrets are entered in the Render dashboard (sync: false); the rest is set here.
# See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: tender-rag
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /mcp only answers authenticated POSTs, so probe the open liveness route.
    healthCheckPath: /healthz
    dockerCommand: python -m app.mcp_server --http --host 0.0.0.0
    envVars:
      # --- MCP auth: REQUIRED. The server refuses to start in HTTP mode without
      # it. Use Render's "Generate" button to create a strong value. ---
      - key: MCP_AUTH_TOKEN
        generateValue: true
      # DNS-rebinding protection rejects any Host it doesn't know. Render injects
      # RENDER_EXTERNAL_HOSTNAME and config.py trusts it, so this needs nothing.

      # --- Neon Postgres (secrets: fill in the dashboard) ---
      - key: POSTGRES_HOST        # <your-project>.neon.tech
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_SSLMODE
        value: require
      # --- embeddings: in-process fastembed (no key, no quota) ---
      - key: EMBED_PROVIDER
        value: fastembed
      # reranker off on the free tier (RAM); hybrid search still runs. Flip to
      # "true" if you move to a larger instance.
      - key: USE_RERANKER
        value: "false"
      # --- chat: Llama 4 via OpenRouter (secret: fill in the dashboard) ---
      - key: LLAMA_API_KEY        # openrouter.ai → Keys
        sync: false
      - key: LLAMA_API_URL
        value: https://openrouter.ai/api/v1
      - key: LLAMA_MODEL
        value: meta-llama/llama-4-maverick
      - key: LLAMA_FALLBACK_MODELS
        value: meta-llama/llama-4-scout
      # optional cross-provider backup (non-Llama gpt-oss); leave unset to skip
      - key: GROQ_API_KEY         # console.groq.com
        sync: false
      # --- no scraper binaries on the host: query pre-loaded tenders only ---
      - key: ENABLE_SCRAPING
        value: "false"
      - key: TOP_K
        value: "8"
